<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chess study</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study">
<meta name="theme-color" content="#16180F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Spectral:ital,wght@0,400;0,600;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="../chess-drills/icon.png">
<style>
:root{
  --ink:#16180F; --board:#5F7888; --cream:#E6E9EC; --paper:#F4F2E6;
  --flag:#C4370F; --muted:#6E7059; --rule:#CFCBB0; --good:#0B62B0; --gold:#F7D24C; --blue:#0B62B0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Spectral,Georgia,serif;font-size:18px;line-height:1.5;padding-bottom:5rem}
.wrap{max-width:34rem;margin:0 auto;padding:0 1rem}
.eyebrow{font-family:'Roboto Mono',monospace;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
h1{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:clamp(2.4rem,11vw,3.4rem);line-height:.92;margin:0 0 .7rem;text-transform:uppercase}
h2{font-family:'Saira Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:1.45rem;margin:2.2rem 0 .2rem;line-height:1.1}
h3{font-family:'Saira Condensed',sans-serif;font-weight:600;font-size:1.25rem;margin:0;line-height:1.15}
.mast{padding:2.2rem 0 .4rem}
.lede{margin:0;font-size:1.02rem;color:#3A3D2E}
.note{border-left:3px solid var(--flag);padding:.1rem 0 .1rem .8rem;margin:1rem 0;font-size:.95rem}
.gblurb{margin:.2rem 0 .8rem;color:#3A3D2E;font-size:.97rem}
.deck{display:flex;gap:.8rem;align-items:center;padding:.85rem 0;border-top:1px solid var(--rule);text-decoration:none;color:inherit;min-height:3.4rem}
.deck:active{background:#ECE9D6}
.dtag{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:1rem;background:var(--ink);color:var(--paper);min-width:2.5rem;height:2.5rem;display:grid;place-items:center;flex:none;padding:0 .3rem}
.dtag.lesson{background:var(--board)}
.dtag.play{background:var(--gold);color:var(--ink)}
.dbody{flex:1;min-width:0}
.dbody p{margin:.1rem 0 0;font-size:.9rem;color:#4A4D3B;line-height:1.35}
.dprog{font-family:'Roboto Mono',monospace;font-size:.78rem;color:var(--muted);flex:none;text-align:right}
.dprog b{color:var(--good);font-weight:500}
.tools{margin:2.5rem 0 0;border-top:1px solid var(--rule);padding-top:1rem;font-size:.9rem;color:var(--muted)}
.btn{font-family:'Saira Condensed',sans-serif;font-weight:600;font-size:1.1rem;padding:.7rem 1rem;line-height:1.15;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;min-height:2.9rem;text-decoration:none;display:inline-block;border-radius:0;-webkit-appearance:none}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--rule)}
.btn.sm{font-size:.95rem;padding:.45rem .7rem;min-height:2.4rem}
.btn:disabled{opacity:.35}
.btn.on{background:var(--board);border-color:var(--board);color:#fff}
.btn.right{background:var(--good);border-color:var(--good);color:#fff}
.btn.wrong{background:var(--flag);border-color:var(--flag);color:#fff}

/* runner */
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:.5rem;padding:.45rem 0}
.top a.back{font-family:'Saira Condensed',sans-serif;font-weight:600;text-decoration:none;color:var(--ink);border:1px solid var(--rule);padding:.35rem .6rem;font-size:1rem}
.top .dt{flex:1;min-width:0;font-family:'Saira Condensed',sans-serif;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .cn{font-family:'Roboto Mono',monospace;font-size:.75rem;color:var(--muted);flex:none}
.chead{margin:.9rem 0 .5rem}
.chead .sub{font-family:'Roboto Mono',monospace;font-size:.72rem;color:var(--muted);margin:.25rem 0 0;letter-spacing:.02em}
.bwrap{width:100%;max-width:30rem;margin:0 auto;touch-action:manipulation}
svg.bd{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.dots{display:flex;gap:3px;margin:.6rem 0 .2rem;flex-wrap:wrap}
.dots i{height:4px;flex:1;min-width:6px;background:var(--rule)}
.dots i.on{background:var(--board)} .dots i.cur{background:var(--ink)}
.txt{margin:.7rem 0 .2rem;min-height:4.5rem}
.txt p{margin:0 0 .6rem}
.txt .ask{font-weight:600}
.mv{font-family:'Roboto Mono',monospace;font-weight:500;font-size:.92em;white-space:nowrap;background:#E6E2C8;padding:0 .2em}
.dim{color:var(--muted);font-size:.92em}
.verdict{font-family:'Saira Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--flag)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin:.7rem 0}
.row .btn{flex:1 1 auto;text-align:center}
.cnav{display:flex;gap:.5rem;margin:1.6rem 0 0;border-top:1px solid var(--rule);padding-top:.8rem}
.cnav .btn{flex:1;text-align:center}
.cnav .mid{flex:2}
.legend{font-size:.82rem;color:var(--muted);margin:.3rem 0 0;display:flex;gap:.9rem;flex-wrap:wrap}
.legend span::before{content:'';display:inline-block;width:.7rem;height:.7rem;margin-right:.3rem;vertical-align:-.05rem;background:var(--c)}
.sum{border:1px solid var(--rule);padding:.8rem;margin:1rem 0}
.links{font-size:.88rem;margin:.6rem 0 0}
.links a{color:var(--blue)}
textarea.exp{width:100%;height:8rem;font-family:'Roboto Mono',monospace;font-size:.7rem}
ul.tight{margin:.2rem 0 .6rem;padding-left:1.2rem} ul.tight li{margin:.2rem 0}
</style>
</head>

<script>
(function(){
'use strict';
var TEST=/[?&]test=1/.test(location.search);
var KEY=TEST?'study.test.v1':'study.v1';
var app=document.getElementById('app');
var manifest=null, deckCache={};
var COL={g:'#0B62B0',r:'#D5380B',b:'#16180F',y:'#F7D24C',k:'#16180F'};
var GLYPH={found:'\u2713',missed:'\u2715',extra:'+'};

// ---------------------------------------------------------------- storage
function load(){ try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};} }
function save(s){ try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){} }
function rec(k){ return load()[k]||null; }
function put(k,fn){ var s=load(); var r=s[k]||{}; fn(r); s[k]=r; save(s); }

// ---------------------------------------------------------------- board
function sqi(u){ return {f:u.charCodeAt(0)-97, r:+u[1]-1}; }
function xy(u,flip){ var s=sqi(u); return flip?{x:7-s.f,y:s.r}:{x:s.f,y:7-s.r}; }
function fenBoard(fen){
  var out={}, rows=fen.split(' ')[0].split('/');
  for(var r=0;r<8;r++){ var f=0; for(var i=0;i<rows[r].length;i++){ var c=rows[r][i];
    if(c>='1'&&c<='8'){f+=+c;} else { out[String.fromCharCode(97+f)+(8-r)]=c; f++; } } }
  return out;
}
function boardSvg(o){
  // o: {fen, flip, last, arrows, marks, sel:[sq], tap:bool}
  var flip=!!o.flip, pcs=fenBoard(o.fen), h=[];
  h.push('<svg class="bd" viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg">');
  h.push('<defs><marker id="ah-g" viewBox="0 0 4 4" refX="2.2" refY="2" markerWidth="2.6" markerHeight="2.6" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="'+COL.g+'"/></marker>');
  ['r','b','y','k'].forEach(function(c){ h.push('<marker id="ah-'+c+'" viewBox="0 0 4 4" refX="2.2" refY="2" markerWidth="2.6" markerHeight="2.6" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="'+COL[c]+'"/></marker>'); });
  h.push('</defs>');
  var lastSq=o.last?[o.last.slice(0,2),o.last.slice(2,4)]:[];
  for(var r=1;r<=8;r++)for(var f=0;f<8;f++){
    var u=String.fromCharCode(97+f)+r, p=xy(u,flip), dark=((f+r)%2)===1;
    var fill=dark?'#93A5B1':'#E6E9EC';
    h.push('<rect x="'+p.x+'" y="'+p.y+'" width="1" height="1" fill="'+fill+'"/>');
    if(lastSq.indexOf(u)>=0) h.push('<rect x="'+p.x+'" y="'+p.y+'" width="1" height="1" fill="#F7D24C" opacity=".62"/>');
  }
  (o.marks||[]).forEach(function(m){ var p=xy(m[0],flip), c=COL[m[1]||'r'], op=(m[1]==='y')?'.55':'.3';
    h.push('<rect x="'+(p.x+.04)+'" y="'+(p.y+.04)+'" width=".92" height=".92" fill="'+c+'" opacity="'+op+'"/><rect x="'+(p.x+.04)+'" y="'+(p.y+.04)+'" width=".92" height=".92" fill="none" stroke="'+c+'" stroke-width=".09"/>'); });
  (o.sel||[]).forEach(function(u){ var p=xy(u,flip);
    h.push('<rect x="'+(p.x+.05)+'" y="'+(p.y+.05)+'" width=".9" height=".9" fill="none" stroke="#16180F" stroke-width=".1"/>'); });
  // coordinates
  for(var i=0;i<8;i++){
    var fl=String.fromCharCode(97+(flip?7-i:i)), rk=flip?i+1:8-i;

function step(){ return R.card.steps[R.si]; }

function finishStep(ok, extra){

function finishCard(){

app.addEventListener('click',function(e){

  if(st.noneOk){ S.msg=prefix+(st.noneText||'Nothing here.'); return; }
  var m=st.main, acc=st.accept[m];
  S.shown={uci:m, fen:acc.fen};
  S.rarrows=acc.arrows||[];
  S.msg=prefix+'The move is <span class="mv">'+acc.san+'</span>. '+(acc.note||'');
}
function tryMove(uci){
  var st=step(), S=R.state, acc=null, k;
  for(k in st.accept){ if(k.slice(0,4)===uci){ acc=st.accept[k]; uci=k; break; } }
  if(acc){
    S.done=true; S.shown={uci:uci,fen:acc.fen}; S.rarrows=acc.arrows||[];
    S.msg='<span class="verdict ok">'+(S.tries===0?'Right.':'Yes.')+'</span> <span class="mv">'+acc.san+'</span>. '+(acc.note||'');
    finishStep(S.tries===0,{uci:uci});
  } else if(st.alt && altFor(st,uci)){
    S.from=null; S.msg='<span class="verdict">Not wrong.</span> '+altFor(st,uci);
  } else {
    S.tries++; S.from=null;
    var bad=null; if(st.bad){ for(k in st.bad){ if(k.slice(0,4)===uci){ bad=st.bad[k]; break; } } }
    if(st.noneOk){ S.done=true; S.msg='<span class="verdict no">Nothing was there.</span> '+(st.noneText||''); finishStep(false,{uci:uci}); }
    else S.msg='<span class="verdict no">Not that one.</span> '+(bad||st.wrong||'Try again, or ask to be shown.');
  }
  draw();
}

function altFor(st,uci){ for(var k in st.alt){ if(k.slice(0,4)===uci) return st.alt[k]; } return null; }

// ---------------------------------------------------------------- routing
function route(){
  var h=location.hash||'#/';
  var m=h.match(/^#\/d\/([A-Za-z0-9_-]+)(?:\/(\d+))?/);
  if(m){ run(m[1], m[2]!=null?+m[2]:null); } else { R=null; if(TEST) testHub(); else hub(); }
}
window.addEventListener('hashchange',route);
route();
})();
</script>
